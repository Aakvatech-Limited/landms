codecov:
  require_ci_to_pass: yes

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0.5%

    patch:
      default:
        target: 80%
        threshold: 0%
        base: auto
        branches:
          - version-15-beta
        if_ci_failed: ignore
        only_pulls: true

comment:
  layout: "diff, files"
  require_changes: true
